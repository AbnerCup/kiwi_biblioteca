name: Publicar en Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: namecheap-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y comprobar TypeScript
        run: npm run build

      - name: Actualizar rama hosting para cPanel
        run: bash .github/scripts/publish-hosting.sh

      - name: Validar configuracion de despliegue
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER$FTP_USERNAME$FTP_PASSWORD$FTP_SERVER_DIR" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rama hosting preparada. Publicar desde cPanel; FTPS opcional sin configurar."
            exit 0
          fi
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar el secret $name en Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR debe terminar en /."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Publicar dist por FTPS
        if: steps.ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
          port: 21
          security: strict
          dangerous-clean-slate: false
